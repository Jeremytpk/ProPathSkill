# Render Blueprint for the ProPath server (API, payments, AI).
# Create it from the Render dashboard: New > Blueprint > this repository.
# Values marked "sync: false" are entered in the dashboard and never stored in git.
services:
  - type: web
    name: propath-api
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/access
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      # Website address (where users come back after paying) and allowed browser origins.
      - key: APP_URL
        value: https://propathskill.netlify.app
      - key: CORS_ORIGINS
        value: https://propathskill.netlify.app
      # This server's own public address, e.g. https://propath-api.onrender.com
      - key: SERVER_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Firebase service account JSON, on one line.
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: PROPATH_ADMIN_EMAILS
        sync: false
      - key: PROPATH_ADMIN_KEY
        generateValue: true
      - key: CINETPAY_API_KEY
        sync: false
      - key: CINETPAY_SITE_ID
        sync: false
