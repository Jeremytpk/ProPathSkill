# The ProPath website. The server runs on Render; set VITE_API_URL in Netlify
# (Site configuration > Environment variables) to the Render address, e.g. https://propath-api.onrender.com
[build]
  command = "npx vite build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Single-page app: every route serves index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
